name: Build Windows test installer

on:
  workflow_dispatch:
    inputs:
      label:
        description: "Label to embed in the artifact name (e.g. baseline, fix)"
        required: true
        default: "test"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90

    env:
      DO_NOT_TRACK: "1"
      ELECTRON_CACHE: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder
      ELECTRON_HEADERS_CACHE: ${{ github.workspace }}/.cache/electron-headers
      # Skip macOS notarization hook on Windows.
      CSC_IDENTITY_AUTO_DISCOVERY: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install yq (Windows)
        id: install-yq
        shell: bash
        run: |
          timeout 300 choco install yq --yes --no-progress
          yq --version
        continue-on-error: true

      - name: Install yq (Windows) (retry)
        if: steps.install-yq.outcome == 'failure'
        shell: bash
        run: |
          timeout 300 choco install yq --yes --no-progress
          yq --version

      - name: Setup node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Setup pnpm
        run: corepack enable

      - name: Install dependencies
        id: install-pnpm
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile
        continue-on-error: true

      - name: Install dependencies (retry)
        if: steps.install-pnpm.outcome == 'failure'
        shell: bash
        run: pnpm install --color=always --prefer-offline --frozen-lockfile

      - name: Generate DI registration
        shell: bash
        run: pnpm build:di

      - name: Build packages
        run: pnpm --color=always --stream build

      - name: Build Windows nsis installer (unsigned)
        shell: bash
        run: pnpm --color=always build:app nsis --x64
        env:
          DEBUG: electron-builder,electron-builder:*

      - name: Rename artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out
          # electron-builder's default nsis name is "Freelens Setup <ver>.exe".
          src=$(ls freelens/dist/*.exe | head -1)
          ver=$(jq -r .version freelens/package.json)
          cp "$src" "out/Freelens-${ver}-${{ inputs.label }}-windows-amd64.exe"

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Freelens-windows-${{ inputs.label }}
          path: out/*.exe
          if-no-files-found: error
          retention-days: 14
